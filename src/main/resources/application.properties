
# =====================================================
# EPMS - APPLICATION MANAGEMENT SERVICE
# =====================================================

spring.application.name=application-management

# =====================================================
# SERVER CONFIGURATION
# =====================================================

server.port=8080


# =====================================================
# POSTGRESQL DATABASE CONFIGURATION
# =====================================================

# PostgreSQL database untuk Main Service
spring.datasource.url=jdbc:postgresql://localhost:5432/epms_main_db

# PostgreSQL JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Database credentials
spring.datasource.username=epms_user
spring.datasource.password=epms_password


# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================

# Development: Hibernate create/update table automatically
# Existing data will not be dropped on normal restart
spring.jpa.hibernate.ddl-auto=update

# Display SQL queries in console
spring.jpa.show-sql=true

# Format SQL for easier debugging
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# LOGGING CONFIGURATION
# =====================================================

# Spring Security debug logging
logging.level.org.springframework.security=DEBUG


# =====================================================
# APACHE KAFKA CONFIGURATION
# =====================================================

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092


# =====================================================
# KAFKA PRODUCER CONFIGURATION
# =====================================================

# Serialize message key as String
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Serialize message value as String
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# =====================================================
# KAFKA CONSUMER CONFIGURATION
# =====================================================

# Kafka Consumer Group
spring.kafka.consumer.group-id=epms-document-group

# Read from earliest offset when no committed offset exists
spring.kafka.consumer.auto-offset-reset=earliest

# Deserialize message key as String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserialize message value as String
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
