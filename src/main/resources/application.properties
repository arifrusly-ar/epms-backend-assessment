
# =====================================================
# EPMS - APPLICATION MANAGEMENT SERVICE
# =====================================================

spring.application.name=application-management

# =====================================================
# SERVER CONFIGURATION
# =====================================================

# Port untuk REST API EPMS
server.port=8080


# =====================================================
# MSSQL DATABASE CONFIGURATION
# =====================================================

# Connect ke SQL Server Express menggunakan TCP port 1433
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TESTDB;encrypt=true;trustServerCertificate=true

# Microsoft SQL Server JDBC Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Credentials daripada IntelliJ environment variables
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================

# Hibernate update database schema berdasarkan entity
# Tidak drop semua table setiap kali application restart
spring.jpa.hibernate.ddl-auto=update

# Paparkan SQL query dalam console
spring.jpa.show-sql=true

# Format SQL untuk memudahkan debugging
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# LOGGING CONFIGURATION
# =====================================================

# Kekalkan logging security sedia ada
# INFO lebih sesuai untuk assessment berbanding DEBUG
logging.level.org.springframework.security=INFO

# Simpan application logs ke file
logging.file.name=logs/epms-application.log

# Logging level untuk application
logging.level.root=INFO


# =====================================================
# APACHE KAFKA CONFIGURATION
# =====================================================

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092


# =====================================================
# KAFKA PRODUCER CONFIGURATION
# =====================================================

# Serialize message key sebagai String
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Serialize message value sebagai String
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# =====================================================
# KAFKA CONSUMER CONFIGURATION
# =====================================================

# Kafka Consumer Group
spring.kafka.consumer.group-id=epms-document-group

# Read earliest message jika belum ada committed offset
spring.kafka.consumer.auto-offset-reset=earliest

# Deserialize message key sebagai String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserialize message value sebagai String
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
